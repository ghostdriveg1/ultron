version: "3.9"

services:
  brain:
    build:
      context: ./packages/brain
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./cloudflare_worker
      dockerfile: Dockerfile
    command: npx wrangler dev --local
    ports:
      - "8787:8787"
    env_file: .env
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    env_file: .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
