name: Ultron Heartbeat Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Ultron Webhook
        run: |
          curl -X POST https://ultron-api.saumil.loq/heartbeat \
          -H "Authorization: Bearer ${{ secrets.ULTRON_API_KEY }}"
